services:
  postgres:
    image: postgres:16-alpine
    container_name: resolveos-postgres
    environment:
      POSTGRES_DB: resolveos
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolveos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
