[project]
name = "resolveos"
version = "0.1.0"
description = "ResolveOS Phase 1 foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "pytest>=8.3.2",
  "httpx2>=2.13.1",
  "pytest-asyncio>=0.24.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
